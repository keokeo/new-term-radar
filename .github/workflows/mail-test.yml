name: Test radar email

# Manual delivery check only: no radar collection or state changes.
# The resend.dev test sender can send only to the Resend account email address.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Email provider to test"
        type: choice
        options:
          - gmail_smtp
          - resend
        required: true
        default: gmail_smtp

permissions:
  contents: read

concurrency:
  group: radar-mail-test
  cancel-in-progress: false

jobs:
  mail-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send a test email
        env:
          RADAR_MAIL_PROVIDER: ${{ inputs.provider || 'gmail_smtp' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_TEST_EMAIL_TO }}
          EMAIL_FROM: onboarding@resend.dev
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from radar import notify

          if not os.environ.get("RADAR_EMAIL_TO", "").strip():
              raise SystemExit("Set the repository secret RADAR_TEST_EMAIL_TO before running this test.")
          if len(notify.recipients(os.environ["RADAR_EMAIL_TO"])) != 1:
              raise SystemExit("Set RADAR_TEST_EMAIL_TO to a single test recipient email address.")

          message = "\n".join([
              "## 新词雷达 · 邮件推送测试",
              "",
              "这是一封由 GitHub Actions 发送的测试邮件。",
              "",
              "| 检查项 | 内容 |",
              "|---|---|",
              "| 中文显示 | 你好，邮件测试 |",
              "| 表格显示 | 请确认这一行显示正常 |",
              "",
              "收到此邮件后，请确认正文和表格显示正常。",
          ])
          result = notify.send("新词雷达 · 邮件推送测试", message)
          if not result.startswith("mail sent ("):
              raise SystemExit(result)
          print(result)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("## 邮件测试\n\n发送服务已接受测试邮件请求，请检查收件箱和垃圾邮件文件夹。\n")
          PY
