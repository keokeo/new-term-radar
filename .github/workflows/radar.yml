name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face, where a name is said first. Posts a
#            report only when there is a new name.
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day.
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), add the secret AISA_API_KEY,
# and commit your config.json (remove it from .gitignore first; it holds no secrets).
# Optional secrets: GOANYAPI_API_KEY (related queries in the keyword table),
# RADAR_EMAIL_TO (mail the reports), plus GMAIL_USER and GMAIL_APP_PASSWORD for
# RADAR_MAIL_PROVIDER=gmail_smtp, or RESEND_API_KEY and EMAIL_FROM for resend (default),
# GSC_TOKEN_JSON (the Search Console signal).
#
# State lives in a shared Actions cache, with one entry per run attempt. The two
# competitor seeds only fill missing snapshots. The pre-outage artifact can boot
# an empty main cache while it is retained. Other site baselines must rebuild.
# Manual "competitors" validates only public sitemap scopes in a temporary copy;
# it has no API/mail credentials and leaves new URLs for the next daily report.

on:
  schedule:
    - cron: "13 0,8,16 * * *"  # sources, offset from the top of the hour
    - cron: "30 1 * 1-12 *"    # daily at 09:30 Asia/Singapore
  workflow_dispatch:
    inputs:
      command:
        description: "daily / sources, or free competitor sitemap validation"
        type: choice
        options:
          - daily
          - sources
          - competitors
        required: true
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '30 1 * 1-12 *' && 'daily' || 'sources') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-state-

      - name: Download the November 14 backup when the cache is empty
        id: recovery-artifact
        if: >-
          github.repository == 'keokeo/new-term-radar' &&
          github.ref == 'refs/heads/main' &&
          steps.restore-state.outputs.cache-matched-key == '' &&
          hashFiles('state/radar.db') == ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43459323857
          artifact-ids: 14054469287
          merge-multiple: true
          path: ${{ runner.temp }}/radar-recovery

      - name: Restore the database and competitor snapshots
        if: steps.recovery-artifact.outcome == 'success'
        env:
          RADAR_RECOVERY: ${{ runner.temp }}/radar-recovery
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          from scripts.seed_competitor_sitemaps import RepositoryFiles, SITES, validate_snapshot

          backup = RepositoryFiles(Path(os.environ["RADAR_RECOVERY"]))
          workspace = RepositoryFiles(Path.cwd())
          try:
              config = json.loads(workspace.read(("config.json",)))
              database = ("state", "radar.db")
              data = backup.read(database)
              with sqlite3.connect(":memory:") as db:
                  db.deserialize(data)
                  if db.execute("PRAGMA quick_check").fetchall() != [("ok",)]:
                      raise ValueError("Backup database failed SQLite integrity check")
                  leads = db.execute("SELECT COUNT(*) FROM leads").fetchone()[0]
              files = [(database, data, f"{leads} leads")]
              for site, host in SITES.items():
                  target = ("state", "sitemaps", f"{site}.json.gz")
                  snapshot = backup.read(target)
                  count = validate_snapshot(snapshot, config["sitemaps"][site], host)
                  files.append((target, snapshot, f"{count} known URLs"))
              for target, data, description in files:
                  if workspace.publish(target, data):
                      print(f"Restored {target[-1]}: {description}")
                  else:
                      print(f"Kept existing {target[-1]}")
          finally:
              backup.close()
              workspace.close()
          PY

      - name: Import missing competitor baselines
        id: competitor-seed
        run: python scripts/seed_competitor_sitemaps.py

      - name: Validate the two competitor sitemaps (free, no email)
        if: env.COMMAND == 'competitors'
        run: python scripts/check_competitor_sitemaps.py

      - name: Run the radar
        if: env.COMMAND != 'competitors'
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}
          TRUSTMRR_API_KEY: ${{ secrets.TRUSTMRR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          RADAR_MAIL_PROVIDER: ${{ vars.RADAR_MAIL_PROVIDER || 'resend' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          if [ "$COMMAND" = "daily" ]; then
            python -m radar daily --skip x,hf --out report.md ${RADAR_EMAIL_TO:+--mail}
          elif [ "$COMMAND" = "sources" ]; then
            python -m radar sources --out report.md ${RADAR_EMAIL_TO:+--mail}
          else
            echo "Unknown radar command" >&2
            exit 2
          fi

      - name: Show the report
        if: always()
        run: |
          if [ "$COMMAND" = "competitors" ] && [ -f competitors-report.md ]; then
            cat competitors-report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the state
        if: always() && steps.competitor-seed.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report.md
            report.json
            competitors-report.md
            competitors-report.json
            competitors-status.json
            state/radar.db
            state/sitemaps/dreamina.json.gz
            state/sitemaps/mediaio.json.gz
          if-no-files-found: ignore
          retention-days: 30
