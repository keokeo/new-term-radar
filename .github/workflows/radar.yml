name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face, where a name is said first. Posts a
#            report only when there is a new name.
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day.
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), add the secret AISA_API_KEY,
# and commit your config.json (remove it from .gitignore first; it holds no secrets).
# Optional secrets: GOANYAPI_API_KEY (related queries in the keyword table),
# RADAR_EMAIL_TO (mail the reports), plus GMAIL_USER and GMAIL_APP_PASSWORD for
# RADAR_MAIL_PROVIDER=gmail_smtp, or RESEND_API_KEY and EMAIL_FROM for resend (default),
# GSC_TOKEN_JSON (the Search Console signal).
#
# State lives in a shared Actions cache, with one entry per run attempt. The two
# competitor seeds only fill missing snapshots. A missing cache still loses other
# source history, so keep the uploaded state backups when that history matters.
# Manual "competitors" validates only public sitemap scopes in a temporary copy;
# it has no API/mail credentials and leaves new URLs for the next daily report.

on:
  schedule:
    - cron: "0 0,8,16 * * *"   # sources
    - cron: "30 1 * * *"       # daily
  workflow_dispatch:
    inputs:
      command:
        description: "daily / sources, or free competitor sitemap validation"
        type: choice
        options:
          - daily
          - sources
          - competitors
        required: true
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '30 1 * * *' && 'daily' || 'sources') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-state-

      - name: Import missing competitor baselines
        id: competitor-seed
        run: python scripts/seed_competitor_sitemaps.py

      - name: Validate the two competitor sitemaps (free, no email)
        if: env.COMMAND == 'competitors'
        run: python scripts/check_competitor_sitemaps.py

      - name: Run the radar
        if: env.COMMAND != 'competitors'
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GOANYAPI_API_KEY: ${{ secrets.GOANYAPI_API_KEY }}
          TRUSTMRR_API_KEY: ${{ secrets.TRUSTMRR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          RADAR_MAIL_PROVIDER: ${{ vars.RADAR_MAIL_PROVIDER || 'resend' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
        run: |
          if [ "$COMMAND" = "daily" ]; then
            python -m radar daily --skip x,hf --out report.md ${RADAR_EMAIL_TO:+--mail}
          elif [ "$COMMAND" = "sources" ]; then
            python -m radar sources --out report.md ${RADAR_EMAIL_TO:+--mail}
          else
            echo "Unknown radar command" >&2
            exit 2
          fi

      - name: Show the report
        if: always()
        run: |
          if [ "$COMMAND" = "competitors" ] && [ -f competitors-report.md ]; then
            cat competitors-report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f report.md ]; then
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the state
        if: always() && steps.competitor-seed.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report.md
            report.json
            competitors-report.md
            competitors-report.json
            competitors-status.json
            state/radar.db
            state/sitemaps/dreamina.json.gz
            state/sitemaps/mediaio.json.gz
          if-no-files-found: ignore
          retention-days: 30
