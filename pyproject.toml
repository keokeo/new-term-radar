[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "new-term-radar"
version = "0.6.1"
description = "Names that are starting to surge in AI, and the generic search terms behind them"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Zhu" }]
keywords = ["seo", "keyword-research", "google-trends", "ai", "mcp", "mcp-server", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zhuyansen/new-term-radar"
Issues = "https://github.com/zhuyansen/new-term-radar/issues"

[project.optional-dependencies]
mail = ["markdown>=3.5"]
mcp = ["mcp>=1.2"]

[project.scripts]
new-term-radar = "new_term_radar.__main__:main"
new-term-radar-mcp = "new_term_radar.mcp_server:main"

# The code lives in radar/ so `python -m radar` works from a clone. Installed, the
# package is `new_term_radar`: PyPI already has an unrelated project that owns `radar`.
[tool.setuptools]
packages = ["new_term_radar"]

[tool.setuptools.package-dir]
new_term_radar = "radar"

# The example config, so `uvx new-term-radar` runs without a clone (radar/config.py EXAMPLE).
[tool.setuptools.package-data]
new_term_radar = ["config.example.json"]
